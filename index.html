<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ROVEX</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background:
        radial-gradient(
          circle at center,
          #17132c,
          #05050b 65%
        );

      color: white;
      font-family: Arial, sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 30px;
    }

    .logo {
      font-size: 65px;
      font-weight: bold;
      letter-spacing: 8px;

      color: #9b70ff;

      text-shadow:
        0 0 10px #7c3cff,
        0 0 30px #7c3cff,
        0 0 60px #7c3cff;

      animation: glow 2s ease-in-out infinite alternate;
    }

    @keyframes glow {
      from {
        text-shadow:
          0 0 10px #7c3cff,
          0 0 25px #7c3cff;
      }

      to {
        text-shadow:
          0 0 20px #9b70ff,
          0 0 45px #7c3cff,
          0 0 70px #7c3cff;
      }
    }

    .welcome {
      margin-top: 18px;

      font-size: 22px;
      color: #c5c5d5;
    }

    .sub {
      margin-top: 9px;

      color: #777789;
      font-size: 14px;
    }

    .enter {
      margin-top: 35px;

      padding: 15px 48px;

      border: 0;
      border-radius: 12px;

      color: white;
      background: #7040dd;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 15px rgba(112, 64, 221, 0.5);

      transition:
        transform 0.2s,
        box-shadow 0.2s;
    }

    .enter:hover {
      transform: scale(1.07);

      box-shadow:
        0 0 25px rgba(112, 64, 221, 0.8),
        0 0 45px rgba(112, 64, 221, 0.4);
    }

    .enter:active {
      transform: scale(0.96);
    }

    @media (max-width: 600px) {

      .logo {
        font-size: 48px;
        letter-spacing: 6px;
      }

      .welcome {
        font-size: 19px;
      }

      .enter {
        padding: 14px 40px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      ROVEX
    </div>

    <div class="welcome">
      Welcome to my world
    </div>

    <div class="sub">
      Explore the world of Rovex
    </div>

    <button
      class="enter"
      onclick="enterWorld()"
    >
      ENTER
    </button>

  </div>


  <script>
    function enterWorld() {
      window.location.href = "home.html";
    }
  </script>

</body>
</html>
